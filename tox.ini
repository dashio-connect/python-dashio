[tox]
minversion = 4.0.0
envlist = py311, py312, py313, py314, flake8
isolated_build = true
requires = tox-uv

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    -r{toxinidir}/requirements_dev.txt
commands =
    pytest --basetemp={envtmpdir}

[testenv:flake8]
basepython = python3.14
deps = flake8
commands = flake8 dashio tests utilities
